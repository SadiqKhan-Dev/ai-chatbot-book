<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="chapterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#chapterGrad)"/>
  <!-- Geometric pattern -->
  <g fill="none" stroke="white" stroke-width="1" opacity="0.1">
    <polygon points="0,200 100,100 200,200"/>
    <polygon points="200,200 300,100 400,200"/>
    <polygon points="400,200 500,100 600,200"/>
    <polygon points="600,200 700,100 800,200"/>
    <line x1="0" y1="0" x2="800" y2="200"/>
    <line x1="0" y1="50" x2="800" y2="250"/>
    <line x1="0" y1="100" x2="800" y2="300"/>
  </g>
  <!-- Center icon -->
  <g transform="translate(400, 100)" fill="white" opacity="0.2">
    <rect x="-30" y="-30" width="60" height="60" rx="12"/>
    <circle cx="0" cy="-8" r="8"/>
    <rect x="-12" y="4" width="24" height="4" rx="2"/>
    <rect x="-12" y="12" width="16" height="3" rx="1.5"/>
  </g>
</svg>
