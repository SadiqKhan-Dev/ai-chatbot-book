<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="80%" r="40%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#heroGrad)"/>
  <rect width="1200" height="400" fill="url(#glow1)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>
  <!-- Tech pattern -->
  <g fill="none" stroke="white" stroke-width="0.5" opacity="0.05">
    <circle cx="100" cy="100" r="50"/>
    <circle cx="100" cy="100" r="70"/>
    <circle cx="1100" cy="300" r="60"/>
    <circle cx="1100" cy="300" r="80"/>
    <line x1="100" y1="100" x2="1100" y2="300" stroke-dasharray="20,10"/>
    <path d="M50 200 Q100 150 150 200 T250 200 T350 200"/>
  </g>
  <!-- Dots -->
  <g fill="white" opacity="0.1">
    <circle cx="200" cy="80" r="2"/>
    <circle cx="400" cy="120" r="1.5"/>
    <circle cx="600" cy="60" r="2"/>
    <circle cx="800" cy="100" r="1.5"/>
    <circle cx="1000" cy="80" r="2"/>
    <circle cx="300" cy="320" r="2"/>
    <circle cx="500" cy="350" r="1.5"/>
    <circle cx="700" cy="300" r="2"/>
    <circle cx="900" cy="340" r="1.5"/>
  </g>
</svg>
